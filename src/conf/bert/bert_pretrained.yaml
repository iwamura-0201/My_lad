# 事前計算済みEventID埋め込みを使用するBERTモデルの設定
# Sentence-BERTで生成された埋め込みをEventIDに使用

default:
  dir_name: outputs
  resource: "local"
  num_workers: 16
  epochs: 200
  r_seed: 31
  device_id: "cuda:0"
  deterministic: True
  check_val_every_n_epoch: 1
  early_stop_patience: 20
  monitor:
    name: "ValTotal"
    mode: "min"

network: 
  ver: "logbert"
  encoder:
    name: bert_pretrained
    hidden_size: 384  # Sentence-BERTの出力次元に合わせる
    layer_num: 4
    attn_heads: 6     # 384 / 6 = 64 (head_dim)
    dropout: 0.1
    pretrained_embed_path: "../data/embedding/eventid_sentence_bert_embeddings.npy"
    eventid_mapping_path: "../data/embedding/eventid_sentence_bert_embeddings.json"
    freeze_pretrained: True  # 事前計算済み埋め込みを凍結
  is_logkey: True
  is_time: False

loss:
  num: 2
  mask:
    bias: 0.9
  hypersphere:
    bias: 0.1

dataset:
  name: "T1105"
  version: 2
  parser: True
  train_ratio: 0.8
  another_method: True
  dataset_dir: "../data/processed/Integrated_fixed"
  sample:
    window_size:  128
    adaptive_window: True
    seq_len: 256
    min_len: 10 
    mask_ratio: 0.65
    sample_ratio: 1
    valid_size: 0.1

  vocab:
    name: wordvocab
    vocab_size: 430  # 423 EventIDs + 特殊トークン(PAD, UNK, SOS, MASK等)
    min_freq: 1

eval:
  hypersphere_loss_test: False
  num_candidates: 15
  
optimizer:
  name: SGD
  scheduler:
    name: cosine 
  hp:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005
    lr_decay: 0.0001
    lr_warmup_step: 5
    lr_warmup_init: 1e-5
    batch_size: 32
    nesterov: True
    warmup_prefix: False

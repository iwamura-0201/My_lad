default:
  dir_name: ../outputs
  resource: "local"
  num_workers: 16
  epochs: 200
  r_seed: 31
  device_id: "cuda:0"
  deterministic: True
  check_val_every_n_epoch: 1
  early_stop_patience: 30
  monitor:
    name: "ValTotal"
    mode: "min"

network: 
  ver: "logbert"
  encoder:
      name: bert_no_time
      hidden_size: 256
      layer_num: 4
      attn_heads: 4
      dropout: 0.1
  is_logkey: True
  is_time: True
loss:
  num: 2
  mask:
    bias: 0.9
  hypersphere:
    bias: 0.1
dataset:
  name: "ex3"
  parser: True
  dataset_dir: "../data/processed/ex3"
  window_type: "fixed"
  sample:
    window_size:  128
    adaptive_window: True
    seq_len: 512
    min_len: 10 
    mask_ratio: 0.65
    sample_ratio: 1
    valid_size: 0.1
  vocab:
    name: wordvocab
    vocab_size: None # None ⇒ 訓練開始時、自動的に計算
    min_freq: 1
eval:
  dataset_dir: "../data/processed/ex2/WEB1"
  hypersphere_loss_test: False
  num_candidates: 15
  per_project_eval: False  # プロジェクト別精度を計算するかどうか
  project_eval_threshold: 0.5  # プロジェクト別評価の異常判定閾値
  #seq_range_start: 0.0   # 開始しきい値
  #seq_range_end: 0.1     # 終了しきい値（例）
  #seq_range_step: 0.01   # 刻み幅

optimizer:
  name: SGD
  scheduler:
    name: cosine 
  hp:
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0005
    lr_decay: 0.0001
    lr_warmup_step: 5
    lr_warmup_init: 1e-5
    batch_size: 32
    nesterov: True
    warmup_prefix: False


